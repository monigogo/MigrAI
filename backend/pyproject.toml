[project]
name = "migrai"
version = "0.1.0"
description = "Guía experto en extranjería española — sistema multiagente con RAG"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "langchain>=0.2.0",  # lo requiere la integración langchain de Langfuse
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "supabase>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24.0",
    "sentence-transformers>=3.0.0",
    "langchain-groq>=1.1.2",
    "torch>=2.0.0",
    "langfuse>=4.0.2",
    "langchain-core>=1.2.19",
    "slowapi>=0.1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval_live: llama al LLM real (Groq) — no se ejecuta en CI, requiere RUN_LIVE_EVAL=1 y credenciales reales.",
]
