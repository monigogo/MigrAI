services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: migrai_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
     
      - PORT=8000 
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: migrai_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
